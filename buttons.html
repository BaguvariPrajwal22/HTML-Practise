 <button class="subscribe-button">SUBSCRIBE</button>

 <style>
    .subscribe-button {background-color: rgb(200, 00, 00);
    color: white;
    border: none;
    height:36px;
    width : 100px;
    border-radius: 2px;
    cursor: pointer;
    transition: opacity 0.15s;}
   
    .subscribe-button:hover
    {
        opacity:0.8;
    } 

    .subscribe-button:active
    {
      opacity:0.5;   

    }
    
 </style>
