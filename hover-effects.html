 <button class="request-button">Request now</button>
   
    <style> .request-button {background-color: rgba(0, 0, 0, 0.832);
    color: white;
    border: none;
    height:36px;
    width : 100px;
    border-radius: 2px;
    cursor: pointer;
    transition: opacity 0.15s;}
   
    .request-button:hover
    {
        opacity:0.8;
    } 

    .request-button:active
    {
      opacity:0.5;   

    }

    </style>
